seed: 42

project:
  name: skin-cancer-segmentation
  experiment_name: skin-cancer-segmentation

mlflow:
  tracking_uri: sqlite:///experiments/mlflow.db

data:
  root: data/processed
  image_size: 256
  batch_size: 16
  num_workers: 0
  remove_hair: true
  dataset: isic2018
  split_path: data/processed/splits.json

training:
  epochs: 100
  warmup_epochs: 5
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 20
  amp: true
  max_batches_per_epoch: null
  checkpoint_path: experiments/checkpoints/best_model.pt

model:
  name: unetpp
  encoder: efficientnet-b4
  encoder_weights: imagenet
  decoder_channels_scale: 32

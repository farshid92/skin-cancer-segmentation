[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-cancer-segmentation"
version = "0.1.0"
description = "Reproducible evolutionary ensemble learning for dermoscopic lesion segmentation."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "omegaconf>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "black>=24,<26",
    "mypy>=1.11,<2",
    "pre-commit>=3.7,<5",
]

research = [
    "albumentations>=1.4,<3",
    "monai>=1.3,<2",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "segmentation-models-pytorch>=0.3,<1",
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
]

mlops = [
    "fastapi>=0.112,<1",
    "gradio>=4.40,<6",
    "mlflow>=2.9,<4",
    "onnx>=1.16,<2",
    "onnxruntime>=1.18,<2",
    "prometheus-fastapi-instrumentator>=7,<8",
    "prometheus-client>=0.20,<1",
    "uvicorn[standard]>=0.30,<1",
]

evolution = [
    "pymoo>=0.6,<1",
    "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["src"]
